name: Build and publish latest upstream OCCT SDK

on:
  schedule:
    - cron: '17 6 * * *'
  pull_request:
    branches:
      - master
    paths:
      - .github/occt-sdk-release/**
      - .github/linux-occt-sdk/**
      - .github/macos-occt-sdk/**
      - .github/windows-occt-sdk/**
      - .github/workflows/build-linux-packages.yml
      - .github/workflows/build-macos-packages.yml
      - .github/workflows/build-windows-packages.yml
      - .github/workflows/build-latest-occt-sdk.yml
  workflow_dispatch:
    inputs:
      upstream_tag:
        description: Optional exact stable upstream tag (for example V8.0.1); empty means latest stable release
        required: false
        type: string
      force_qualify:
        description: Re-run qualification even when a matching SDK release already exists
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('occt-upstream-sdk-pr-{0}', github.event.pull_request.number) || 'occt-upstream-sdk-release' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  detect:
    name: Detect unbuilt stable upstream release
    runs-on: ubuntu-24.04
    outputs:
      should_build: ${{ steps.release.outputs.should_build }}
      should_publish: ${{ steps.release.outputs.should_publish }}
      upstream_tag: ${{ steps.release.outputs.upstream_tag }}
      occt_version: ${{ steps.release.outputs.occt_version }}
      source_sha: ${{ steps.release.outputs.source_sha }}
      release_tag: ${{ steps.release.outputs.release_tag }}
    env:
      GH_TOKEN: ${{ github.token }}
      UPSTREAM_REPOSITORY: Open-Cascade-SAS/OCCT
      REQUESTED_TAG: ${{ inputs.upstream_tag || '' }}
      FORCE_QUALIFY: ${{ github.event_name == 'pull_request' || inputs.force_qualify || false }}
    steps:
      - name: Resolve latest stable upstream release
        id: release
        shell: bash
        run: |
          set -euo pipefail

          if [[ -n "$REQUESTED_TAG" ]]; then
            release_json="$(gh api "repos/$UPSTREAM_REPOSITORY/releases/tags/$REQUESTED_TAG")"
          else
            release_json="$(gh api "repos/$UPSTREAM_REPOSITORY/releases/latest")"
          fi

          test "$(jq -r '.draft' <<<"$release_json")" = "false"
          test "$(jq -r '.prerelease' <<<"$release_json")" = "false"
          upstream_tag="$(jq -r '.tag_name' <<<"$release_json")"
          if [[ ! "$upstream_tag" =~ ^V([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "unsupported stable OCCT tag: $upstream_tag" >&2
            exit 1
          fi
          occt_version="${BASH_REMATCH[1]}"

          object_json="$(gh api "repos/$UPSTREAM_REPOSITORY/git/ref/tags/$upstream_tag")"
          object_type="$(jq -r '.object.type' <<<"$object_json")"
          source_sha="$(jq -r '.object.sha' <<<"$object_json")"
          for _ in 1 2 3 4 5; do
            if [[ "$object_type" == "commit" ]]; then
              break
            fi
            if [[ "$object_type" != "tag" ]]; then
              echo "upstream tag resolves to unsupported object type: $object_type" >&2
              exit 1
            fi
            object_json="$(gh api "repos/$UPSTREAM_REPOSITORY/git/tags/$source_sha")"
            object_type="$(jq -r '.object.type' <<<"$object_json")"
            source_sha="$(jq -r '.object.sha' <<<"$object_json")"
          done
          if [[ "$object_type" != "commit" ]]; then
            echo "could not peel upstream tag $upstream_tag to a commit" >&2
            exit 1
          fi

          version_json="$(gh api "repos/$UPSTREAM_REPOSITORY/contents/adm/cmake/version.cmake?ref=$source_sha")"
          version_text="$(jq -r '.content' <<<"$version_json" | tr -d '\n' | base64 --decode)"
          major="$(sed -nE 's/^set \(OCC_VERSION_MAJOR +([0-9]+) *\)/\1/p' <<<"$version_text")"
          minor="$(sed -nE 's/^set \(OCC_VERSION_MINOR +([0-9]+) *\)/\1/p' <<<"$version_text")"
          patch="$(sed -nE 's/^set \(OCC_VERSION_MAINTENANCE +([0-9]+) *\)/\1/p' <<<"$version_text")"
          source_version="$major.$minor.$patch"
          test "$source_version" = "$occt_version"

          release_tag="occt-sdk-$occt_version"
          release_pattern="^occt-sdk-${occt_version//./\\.}-r[0-9]+$"
          matching_release_count=0
          matching_source_count=0
          matching_draft_count=0
          matching_invalid_state_count=0
          existing_tag=""
          while IFS=$'\t' read -r candidate_tag records_source is_draft is_prerelease is_immutable; do
            if [[ "$candidate_tag" == "$release_tag" || "$candidate_tag" =~ $release_pattern ]]; then
              if [[ "$is_draft" == "true" ]]; then
                ((matching_draft_count += 1))
                continue
              fi
              ((matching_release_count += 1))
              if [[ "$is_prerelease" != "false" || "$is_immutable" != "true" ]]; then
                ((matching_invalid_state_count += 1))
              fi
              if [[ -z "$existing_tag" ]]; then
                existing_tag="$candidate_tag"
              fi
              if [[ "$records_source" == "true" ]]; then
                ((matching_source_count += 1))
              fi
            fi
          done < <(
            gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" |
              jq -rs -r --arg source "$source_sha" '
                .[][] | [
                  .tag_name,
                  ((.body // "") | contains($source)),
                  .draft,
                  .prerelease,
                  .immutable
                ] | @tsv
              '
          )

          if (( matching_draft_count > 0 )); then
            echo "stale draft SDK release exists for OCCT $occt_version; remove it before retrying automatic publication" >&2
            exit 1
          fi
          if (( matching_invalid_state_count > 0 )); then
            echo "matching SDK release for OCCT $occt_version is prerelease or not immutable; refusing to treat it as complete" >&2
            exit 1
          fi

          should_build=true
          should_publish=true
          if (( matching_release_count > 0 )); then
            should_publish=false
            if (( matching_source_count != matching_release_count )); then
              echo "existing SDK release(s) for OCCT $occt_version do not record current upstream source $source_sha" >&2
              echo "refusing to ignore a possible upstream retag or provenance mismatch" >&2
              exit 1
            fi
            if [[ "$FORCE_QUALIFY" == "true" ]]; then
              echo "forcing qualification for already-released OCCT $occt_version: $existing_tag"
            else
              should_build=false
              echo "SDK release already exists for OCCT $occt_version: $existing_tag"
            fi
          else
            echo "new stable OCCT release: $upstream_tag -> $source_sha"
          fi

          echo "should_build=$should_build" >> "$GITHUB_OUTPUT"
          echo "should_publish=$should_publish" >> "$GITHUB_OUTPUT"
          echo "upstream_tag=$upstream_tag" >> "$GITHUB_OUTPUT"
          echo "occt_version=$occt_version" >> "$GITHUB_OUTPUT"
          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"
          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"

  linux:
    name: Linux SDKs
    if: needs.detect.outputs.should_build == 'true'
    needs: detect
    uses: ./.github/workflows/build-linux-packages.yml
    with:
      occt_version: ${{ needs.detect.outputs.occt_version }}
      occt_source_sha: ${{ needs.detect.outputs.source_sha }}

  macos:
    name: macOS SDKs
    if: needs.detect.outputs.should_build == 'true'
    needs: detect
    uses: ./.github/workflows/build-macos-packages.yml
    with:
      occt_version: ${{ needs.detect.outputs.occt_version }}
      occt_source_sha: ${{ needs.detect.outputs.source_sha }}

  windows:
    name: Windows SDKs
    if: needs.detect.outputs.should_build == 'true'
    needs: detect
    uses: ./.github/workflows/build-windows-packages.yml
    with:
      occt_version: ${{ needs.detect.outputs.occt_version }}
      occt_source_sha: ${{ needs.detect.outputs.source_sha }}

  qualify:
    name: Verify complete SDK candidate
    if: needs.detect.outputs.should_build == 'true'
    needs:
      - detect
      - linux
      - macos
      - windows
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      OCCT_VERSION: ${{ needs.detect.outputs.occt_version }}
      SOURCE_SHA: ${{ needs.detect.outputs.source_sha }}
      UPSTREAM_TAG: ${{ needs.detect.outputs.upstream_tag }}
      INTENDED_RELEASE_TAG: ${{ needs.detect.outputs.release_tag }}
      PUBLISH_REQUESTED: ${{ needs.detect.outputs.should_publish }}
      WORKFLOW_SHA: ${{ github.sha }}
    steps:
      - name: Checkout exact automation revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          sparse-checkout: .github

      - name: Checkout exact upstream source for preservation
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: Open-Cascade-SAS/OCCT
          ref: ${{ needs.detect.outputs.source_sha }}
          path: source-release
          fetch-depth: 1
          persist-credentials: false

      - name: Download Linux SDKs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: occt-linux-sdk-*
          path: ${{ runner.temp }}/release-assets/linux
          merge-multiple: true

      - name: Download macOS SDKs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: occt-macos-sdk-*
          path: ${{ runner.temp }}/release-assets/macos
          merge-multiple: true

      - name: Download Windows SDKs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: occt-windows-sdk-*
          path: ${{ runner.temp }}/release-assets/windows
          merge-multiple: true

      - name: Verify complete candidate and re-check upstream tag
        shell: bash
        run: |
          set -euo pipefail

          bash .github/occt-sdk-release/verify-release-assets.sh "$RUNNER_TEMP/release-assets"
          mapfile -t assets < <(find "$RUNNER_TEMP/release-assets" -type f -print | sort)
          test "${#assets[@]}" -eq 16

          object_json="$(gh api "repos/Open-Cascade-SAS/OCCT/git/ref/tags/$UPSTREAM_TAG")"
          object_type="$(jq -r '.object.type' <<<"$object_json")"
          current_source_sha="$(jq -r '.object.sha' <<<"$object_json")"
          for _ in 1 2 3 4 5; do
            if [[ "$object_type" == "commit" ]]; then
              break
            fi
            if [[ "$object_type" != "tag" ]]; then
              echo "upstream tag now resolves to unsupported object type: $object_type" >&2
              exit 1
            fi
            object_json="$(gh api "repos/Open-Cascade-SAS/OCCT/git/tags/$current_source_sha")"
            object_type="$(jq -r '.object.type' <<<"$object_json")"
            current_source_sha="$(jq -r '.object.sha' <<<"$object_json")"
          done
          test "$object_type" = "commit"
          if [[ "$current_source_sha" != "$SOURCE_SHA" ]]; then
            echo "upstream tag moved during qualification: expected $SOURCE_SHA, now $current_source_sha" >&2
            exit 1
          fi

          candidate_json="$RUNNER_TEMP/occt-sdk-candidate.json"
          jq -n \
            --arg version "$OCCT_VERSION" \
            --arg upstream_tag "$UPSTREAM_TAG" \
            --arg source_sha "$SOURCE_SHA" \
            --arg workflow_sha "$WORKFLOW_SHA" \
            --arg intended_release_tag "$INTENDED_RELEASE_TAG" \
            '{
              occt_version: $version,
              upstream_tag: $upstream_tag,
              source_sha: $source_sha,
              workflow_sha: $workflow_sha,
              intended_release_tag: $intended_release_tag,
              verified_sdk_file_count: 16
            }' > "$candidate_json"

          {
            echo "### Qualified OCCT $OCCT_VERSION lean SDK candidate"
            echo
            echo "- Upstream tag: \`$UPSTREAM_TAG\`"
            echo "- Source commit: \`$SOURCE_SHA\`"
            echo "- Automation revision: \`$WORKFLOW_SHA\`"
            echo "- Intended release tag: \`$INTENDED_RELEASE_TAG\`"
            echo "- Verified SDK candidate files: 16"
            echo
            if [[ "$PUBLISH_REQUESTED" == "true" ]]; then
              echo "This is a new upstream release. On master, the publish job will re-verify these run artifacts before creating the tag and GitHub Release."
            else
              echo "Qualification-only run: a matching SDK release already exists, so no new tag or GitHub Release will be created."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Create exact upstream source snapshot
        shell: bash
        run: |
          set -euo pipefail

          test "$(git -C source-release rev-parse HEAD)" = "$SOURCE_SHA"
          source_dir="$RUNNER_TEMP/source-assets"
          mkdir -p "$source_dir"
          source_name="opencascade-${OCCT_VERSION}-source-${SOURCE_SHA:0:12}.tar.gz"
          git -C source-release archive \
            --format=tar.gz \
            --prefix="opencascade-${OCCT_VERSION}/" \
            "$SOURCE_SHA" > "$source_dir/$source_name"
          (
            cd "$source_dir"
            sha256sum "$source_name" > "$source_name.sha256"
            sha256sum -c "$source_name.sha256"
          )
          test -s "$source_dir/$source_name"
          test -s "$source_dir/$source_name.sha256"

      - name: Upload exact upstream source snapshot
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: occt-source-snapshot
          path: ${{ runner.temp }}/source-assets/*
          if-no-files-found: error
          retention-days: 3

      - name: Upload candidate metadata
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: occt-sdk-candidate-metadata
          path: ${{ runner.temp }}/occt-sdk-candidate.json
          if-no-files-found: error
          retention-days: 3

  publish:
    name: Publish qualified OCCT SDK release
    if: needs.detect.outputs.should_publish == 'true' && github.ref == 'refs/heads/master'
    needs:
      - detect
      - qualify
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      OCCT_VERSION: ${{ needs.detect.outputs.occt_version }}
      SOURCE_SHA: ${{ needs.detect.outputs.source_sha }}
      UPSTREAM_TAG: ${{ needs.detect.outputs.upstream_tag }}
      INTENDED_RELEASE_TAG: ${{ needs.detect.outputs.release_tag }}
      WORKFLOW_SHA: ${{ github.sha }}
    steps:
      - name: Checkout exact automation revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          sparse-checkout: .github

      - name: Download qualified Linux SDKs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: occt-linux-sdk-*
          path: ${{ runner.temp }}/release-assets/linux
          merge-multiple: true

      - name: Download qualified macOS SDKs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: occt-macos-sdk-*
          path: ${{ runner.temp }}/release-assets/macos
          merge-multiple: true

      - name: Download qualified Windows SDKs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: occt-windows-sdk-*
          path: ${{ runner.temp }}/release-assets/windows
          merge-multiple: true

      - name: Download exact upstream source snapshot
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: occt-source-snapshot
          path: ${{ runner.temp }}/source-assets

      - name: Re-verify qualified assets and upstream source
        shell: bash
        run: |
          set -euo pipefail

          bash .github/occt-sdk-release/verify-release-assets.sh "$RUNNER_TEMP/release-assets"
          mapfile -t assets < <(find "$RUNNER_TEMP/release-assets" -type f -print | sort)
          test "${#assets[@]}" -eq 16

          object_json="$(gh api "repos/Open-Cascade-SAS/OCCT/git/ref/tags/$UPSTREAM_TAG")"
          object_type="$(jq -r '.object.type' <<<"$object_json")"
          current_source_sha="$(jq -r '.object.sha' <<<"$object_json")"
          for _ in 1 2 3 4 5; do
            if [[ "$object_type" == "commit" ]]; then
              break
            fi
            if [[ "$object_type" != "tag" ]]; then
              echo "upstream tag now resolves to unsupported object type: $object_type" >&2
              exit 1
            fi
            object_json="$(gh api "repos/Open-Cascade-SAS/OCCT/git/tags/$current_source_sha")"
            object_type="$(jq -r '.object.type' <<<"$object_json")"
            current_source_sha="$(jq -r '.object.sha' <<<"$object_json")"
          done
          test "$object_type" = "commit"
          if [[ "$current_source_sha" != "$SOURCE_SHA" ]]; then
            echo "upstream tag moved after qualification: expected $SOURCE_SHA, now $current_source_sha" >&2
            exit 1
          fi

          source_name="opencascade-${OCCT_VERSION}-source-${SOURCE_SHA:0:12}.tar.gz"
          test -f "$RUNNER_TEMP/source-assets/$source_name"
          test -f "$RUNNER_TEMP/source-assets/$source_name.sha256"
          (cd "$RUNNER_TEMP/source-assets" && sha256sum -c "$source_name.sha256")

      - name: Create tag, verify draft assets, and publish immutable release
        shell: bash
        run: |
          set -euo pipefail
          api_version="2026-03-10"
          published=0
          immutability_verified=0
          draft_id=""
          create_attempted=0
          run_marker="occt-sdk-auto-run:${GITHUB_RUN_ID}:${GITHUB_RUN_ATTEMPT}"

          resolve_upstream_source_sha() {
            local object_json object_type current_source_sha
            object_json="$(gh api "repos/Open-Cascade-SAS/OCCT/git/ref/tags/$UPSTREAM_TAG")"
            object_type="$(jq -r '.object.type' <<<"$object_json")"
            current_source_sha="$(jq -r '.object.sha' <<<"$object_json")"
            for _ in 1 2 3 4 5; do
              if [[ "$object_type" == "commit" ]]; then
                break
              fi
              if [[ "$object_type" != "tag" ]]; then
                echo "upstream tag now resolves to unsupported object type: $object_type" >&2
                return 1
              fi
              object_json="$(gh api "repos/Open-Cascade-SAS/OCCT/git/tags/$current_source_sha")"
              object_type="$(jq -r '.object.type' <<<"$object_json")"
              current_source_sha="$(jq -r '.object.sha' <<<"$object_json")"
            done
            if [[ "$object_type" != "commit" ]]; then
              echo "could not peel upstream tag $UPSTREAM_TAG to a commit" >&2
              return 1
            fi
            printf '%s\n' "$current_source_sha"
          }

          find_draft_id() {
            gh api --paginate \
              -H "X-GitHub-Api-Version: $api_version" \
              "repos/$GITHUB_REPOSITORY/releases?per_page=100" |
              jq -rs --arg tag "$INTENDED_RELEASE_TAG" '
                [ .[][] | select(.tag_name == $tag and .draft == true) ] |
                if length == 1 then .[0].id
                elif length == 0 then empty
                else error("multiple draft releases found for tag")
                end
              '
          }

          find_our_draft_id() {
            gh api --paginate \
              -H "X-GitHub-Api-Version: $api_version" \
              "repos/$GITHUB_REPOSITORY/releases?per_page=100" |
              jq -rs --arg tag "$INTENDED_RELEASE_TAG" --arg marker "$run_marker" '
                [ .[][] |
                  select(.tag_name == $tag and .draft == true) |
                  select((.body // "") | contains($marker))
                ] |
                if length == 1 then .[0].id
                elif length == 0 then empty
                else error("multiple workflow-owned draft releases found for tag")
                end
              '
          }

          cleanup_failed_publication() {
            status=$?
            trap - EXIT
            if [[ "$status" -eq 0 ]]; then
              exit 0
            fi

            if [[ "$published" -eq 0 ]]; then
              if [[ "$create_attempted" -eq 1 && -z "$draft_id" ]]; then
                draft_id="$(find_our_draft_id 2>/dev/null || true)"
              fi
              if [[ -z "$draft_id" ]]; then
                exit "$status"
              fi
              release_json="$(gh api \
                -H "X-GitHub-Api-Version: $api_version" \
                "repos/$GITHUB_REPOSITORY/releases/$draft_id" 2>/dev/null || true)"
              if [[ -n "$release_json" ]] && jq -e \
                --arg tag "$INTENDED_RELEASE_TAG" \
                --arg marker "$run_marker" \
                '.draft == true and .tag_name == $tag and ((.body // "") | contains($marker))' \
                <<<"$release_json" >/dev/null; then
                gh api -X DELETE \
                  -H "X-GitHub-Api-Version: $api_version" \
                  "repos/$GITHUB_REPOSITORY/releases/$draft_id" || true
              else
                echo "release $draft_id is no longer a verified workflow-owned draft; preserving it and the tag" >&2
              fi
            elif [[ "$immutability_verified" -eq 0 && -n "$draft_id" ]]; then
              release_json="$(gh api \
                -H "X-GitHub-Api-Version: $api_version" \
                "repos/$GITHUB_REPOSITORY/releases/$draft_id" 2>/dev/null || true)"
              if [[ -n "$release_json" ]] && jq -e \
                --arg tag "$INTENDED_RELEASE_TAG" \
                --arg marker "$run_marker" \
                '.draft == false and .prerelease == false and .immutable == false and .tag_name == $tag and ((.body // "") | contains($marker))' \
                <<<"$release_json" >/dev/null; then
                if gh api -X DELETE \
                  -H "X-GitHub-Api-Version: $api_version" \
                  "repos/$GITHUB_REPOSITORY/releases/$draft_id"; then
                  echo "removed workflow-owned published release after GitHub reported it mutable; retained tag for safe retry" >&2
                else
                  echo "failed to remove workflow-owned mutable published release $draft_id; manual remediation is required" >&2
                fi
              else
                echo "release $draft_id is not a verified workflow-owned mutable publication; preserving it and the tag" >&2
              fi
            fi
            exit "$status"
          }
          trap cleanup_failed_publication EXIT

          existing_draft_id="$(find_draft_id)"
          if [[ -n "$existing_draft_id" ]] || gh api \
            -H "X-GitHub-Api-Version: $api_version" \
            "repos/$GITHUB_REPOSITORY/releases/tags/$INTENDED_RELEASE_TAG" >/dev/null 2>&1; then
            echo "release already exists for $INTENDED_RELEASE_TAG" >&2
            exit 1
          fi

          if gh api \
            -H "X-GitHub-Api-Version: $api_version" \
            "repos/$GITHUB_REPOSITORY/git/ref/tags/$INTENDED_RELEASE_TAG" >/dev/null 2>&1; then
            bash .github/linux-occt-sdk/verify-tag.sh "$INTENDED_RELEASE_TAG" "$WORKFLOW_SHA" >/dev/null
          else
            gh api -X POST \
              -H "X-GitHub-Api-Version: $api_version" \
              "repos/$GITHUB_REPOSITORY/git/refs" \
              -f ref="refs/tags/$INTENDED_RELEASE_TAG" \
              -f sha="$WORKFLOW_SHA" >/dev/null
          fi
          bash .github/linux-occt-sdk/verify-tag.sh "$INTENDED_RELEASE_TAG" "$WORKFLOW_SHA" >/dev/null
          bash .github/occt-sdk-release/verify-release-assets.sh "$RUNNER_TEMP/release-assets"

          mapfile -t sdk_assets < <(find "$RUNNER_TEMP/release-assets" -type f -print | sort)
          test "${#sdk_assets[@]}" -eq 16
          mapfile -t source_assets < <(find "$RUNNER_TEMP/source-assets" -maxdepth 1 -type f -print | sort)
          test "${#source_assets[@]}" -eq 2
          assets=("${sdk_assets[@]}" "${source_assets[@]}")
          test "${#assets[@]}" -eq 18
          source_name="opencascade-${OCCT_VERSION}-source-${SOURCE_SHA:0:12}.tar.gz"
          test -f "$RUNNER_TEMP/source-assets/$source_name"
          test -f "$RUNNER_TEMP/source-assets/$source_name.sha256"
          (cd "$RUNNER_TEMP/source-assets" && sha256sum -c "$source_name.sha256")

          notes="OCCT $OCCT_VERSION SDK bundle built from official upstream release $UPSTREAM_TAG at source commit $SOURCE_SHA."
          notes="$notes"$'\n\n'"Windows shared: qualified lean x64 VC143 source-built SDK restricted to the geometry/data-exchange toolkit closure with optional third-party dependencies disabled."
          notes="$notes"$'\n'"Windows static: qualified lean x64 VC143 static SDK from the same official OCCT source commit, with optional third-party dependencies disabled."
          notes="$notes"$'\n'"Linux: qualified lean x86_64 shared/static SDKs with glibc 2.17 baseline."
          notes="$notes"$'\n'"macOS: qualified lean x86_64 and arm64 shared/static SDKs targeting macOS 13.0."
          notes="$notes"$'\n\n'"Exact upstream source snapshot: $source_name (with adjacent SHA-256 checksum). GitHub's generated source archives for this release describe the automation tag, not the packaged OCCT source."
          notes="$notes"$'\n\n'"Automation revision: $WORKFLOW_SHA"
          notes="$notes"$'\n\n'"<!-- $run_marker -->"

          create_attempted=1
          gh release create "$INTENDED_RELEASE_TAG" "${assets[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --draft \
            --title "OCCT $OCCT_VERSION SDKs - Windows, Linux, macOS" \
            --notes "$notes"

          draft_id="$(find_our_draft_id)"
          test -n "$draft_id"
          release_json="$(gh api -H "X-GitHub-Api-Version: $api_version" \
            "repos/$GITHUB_REPOSITORY/releases/$draft_id")"
          test "$(jq -r '.draft' <<<"$release_json")" = "true"
          test "$(jq -r '.prerelease' <<<"$release_json")" = "false"
          test "$(jq -r '.tag_name' <<<"$release_json")" = "$INTENDED_RELEASE_TAG"
          test "$(jq '.assets | length' <<<"$release_json")" -eq 18
          for file in "${assets[@]}"; do
            name="$(basename "$file")"
            expected="sha256:$(sha256sum "$file" | awk '{print $1}')"
            actual="$(jq -r --arg name "$name" '.assets[] | select(.name == $name) | .digest' <<<"$release_json")"
            test "$actual" = "$expected"
          done

          current_source_sha="$(resolve_upstream_source_sha)"
          if [[ "$current_source_sha" != "$SOURCE_SHA" ]]; then
            echo "upstream tag moved while the draft was being uploaded: expected $SOURCE_SHA, now $current_source_sha" >&2
            exit 1
          fi
          bash .github/linux-occt-sdk/verify-tag.sh "$INTENDED_RELEASE_TAG" "$WORKFLOW_SHA" >/dev/null
          gh api -X PATCH \
            -H "X-GitHub-Api-Version: $api_version" \
            "repos/$GITHUB_REPOSITORY/releases/$draft_id" \
            -F draft=false >/dev/null
          published=1

          release_json="$(gh api -H "X-GitHub-Api-Version: $api_version" \
            "repos/$GITHUB_REPOSITORY/releases/$draft_id")"
          test "$(jq -r '.draft' <<<"$release_json")" = "false"
          test "$(jq -r '.prerelease' <<<"$release_json")" = "false"
          if [[ "$(jq -r '.immutable' <<<"$release_json")" != "true" ]]; then
            echo "published release is not immutable; removing the workflow-owned mutable release" >&2
            exit 1
          fi
          immutability_verified=1
          test "$(jq -r '.tag_name' <<<"$release_json")" = "$INTENDED_RELEASE_TAG"
          test "$(jq '.assets | length' <<<"$release_json")" -eq 18
          for file in "${assets[@]}"; do
            name="$(basename "$file")"
            expected="sha256:$(sha256sum "$file" | awk '{print $1}')"
            actual="$(jq -r --arg name "$name" '.assets[] | select(.name == $name) | .digest' <<<"$release_json")"
            test "$actual" = "$expected"
          done
          bash .github/linux-occt-sdk/verify-tag.sh "$INTENDED_RELEASE_TAG" "$WORKFLOW_SHA" >/dev/null
          trap - EXIT

          {
            echo "### Published OCCT $OCCT_VERSION SDK release"
            echo
            echo "- Upstream tag: \`$UPSTREAM_TAG\`"
            echo "- Source commit: \`$SOURCE_SHA\`"
            echo "- Release tag: \`$INTENDED_RELEASE_TAG\`"
            echo "- Automation revision: \`$WORKFLOW_SHA\`"
            echo "- Verified SDK candidate files: 16"
            echo "- Preserved source files: 2"
            echo "- Verified published release files: 18"
            echo "- GitHub release immutable: true"
          } >> "$GITHUB_STEP_SUMMARY"
