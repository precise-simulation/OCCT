name: Release OCCT SDK bundle

on:
  workflow_dispatch:
  push:
    tags:
      - occt-sdk-*

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  OCCT_VERSION: '7.9.3'
  OCCT_SOURCE_SHA: a016080bf6738d6aeae020badee4e888ad1540a5
  WINDOWS_ASSET: opencascade-7.9.3-vc14-64-combined.zip
  WINDOWS_ASSET_SIZE: '258814881'
  WINDOWS_ASSET_SHA256: afbef3457fbc4a2bdca0608e0fe284392f51e4c2c42ccbfb9df7168d8e4eb9b3
  WINDOWS_ASSET_URL: https://github.com/Open-Cascade-SAS/OCCT/releases/download/V7_9_3/opencascade-7.9.3-vc14-64-combined.zip

jobs:
  linux:
    name: Linux SDKs
    uses: ./.github/workflows/build-linux-packages.yml

  macos:
    name: macOS SDKs
    uses: ./.github/workflows/build-macos-packages.yml

  windows:
    name: Copy official Windows SDK
    runs-on: ubuntu-24.04
    steps:
      - name: Download and verify official OCCT Windows package
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/windows-sdk"
          mkdir -p "$out"

          api_version="2022-11-28"
          upstream_release="$(curl --fail --silent --show-error --location \
            -H 'Accept: application/vnd.github+json' \
            -H "X-GitHub-Api-Version: $api_version" \
            https://api.github.com/repos/Open-Cascade-SAS/OCCT/releases/tags/V7_9_3)"
          upstream_asset="$(jq -c --arg name "$WINDOWS_ASSET" \
            '.assets[] | select(.name == $name)' <<<"$upstream_release")"
          test -n "$upstream_asset"
          test "$(jq -r '.size' <<<"$upstream_asset")" = "$WINDOWS_ASSET_SIZE"
          test "$(jq -r '.digest' <<<"$upstream_asset")" = "sha256:$WINDOWS_ASSET_SHA256"
          upstream_url="$(jq -r '.browser_download_url' <<<"$upstream_asset")"
          test "$upstream_url" = "$WINDOWS_ASSET_URL"

          upstream_ref="$(curl --fail --silent --show-error --location \
            -H 'Accept: application/vnd.github+json' \
            -H "X-GitHub-Api-Version: $api_version" \
            https://api.github.com/repos/Open-Cascade-SAS/OCCT/git/ref/tags/V7_9_3)"
          object_type="$(jq -r '.object.type' <<<"$upstream_ref")"
          object_sha="$(jq -r '.object.sha' <<<"$upstream_ref")"
          for _ in 1 2 3 4 5; do
            if [[ "$object_type" == "commit" ]]; then
              break
            fi
            test "$object_type" = "tag"
            tag_json="$(curl --fail --silent --show-error --location \
              -H 'Accept: application/vnd.github+json' \
              -H "X-GitHub-Api-Version: $api_version" \
              "https://api.github.com/repos/Open-Cascade-SAS/OCCT/git/tags/$object_sha")"
            object_type="$(jq -r '.object.type' <<<"$tag_json")"
            object_sha="$(jq -r '.object.sha' <<<"$tag_json")"
          done
          test "$object_type" = "commit"
          test "$object_sha" = "$OCCT_SOURCE_SHA"

          curl --fail --location --retry 3 --retry-all-errors \
            "$upstream_url" \
            --output "$out/$WINDOWS_ASSET"
          test "$(wc -c < "$out/$WINDOWS_ASSET" | tr -d ' ')" = "$WINDOWS_ASSET_SIZE"
          actual="$(sha256sum "$out/$WINDOWS_ASSET" | awk '{print $1}')"
          test "$actual" = "$WINDOWS_ASSET_SHA256"
          printf '%s  %s\n' "$WINDOWS_ASSET_SHA256" "$WINDOWS_ASSET" \
            > "$out/$WINDOWS_ASSET.sha256"
          (cd "$out" && sha256sum -c "$WINDOWS_ASSET.sha256")

      # actions/upload-artifact v4.6.2
      - name: Upload official Windows SDK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: occt-windows-sdk-official
          path: ${{ runner.temp }}/windows-sdk/*
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish combined OCCT SDK release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/occt-sdk-')
    needs:
      - linux
      - macos
      - windows
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      WORKFLOW_SHA: ${{ github.sha }}
      SOURCE_SHA: a016080bf6738d6aeae020badee4e888ad1540a5
      WINDOWS_SHA256: afbef3457fbc4a2bdca0608e0fe284392f51e4c2c42ccbfb9df7168d8e4eb9b3
    steps:
      # actions/checkout v4.2.2
      - name: Checkout exact release workflow revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      # actions/download-artifact v4.3.0
      - name: Download Linux SDKs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: occt-linux-sdk-*
          path: ${{ runner.temp }}/release-assets/linux
          merge-multiple: true

      - name: Download macOS SDKs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: occt-macos-sdk-*
          path: ${{ runner.temp }}/release-assets/macos
          merge-multiple: true

      - name: Download official Windows SDK
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: occt-windows-sdk-official
          path: ${{ runner.temp }}/release-assets/windows

      - name: Verify tag and exact combined asset inventory
        shell: bash
        run: |
          set -euo pipefail
          bash .github/linux-occt-sdk/verify-tag.sh "$GITHUB_REF_NAME" "$WORKFLOW_SHA"
          bash .github/occt-sdk-release/verify-release-assets.sh "$RUNNER_TEMP/release-assets"

      - name: Create, verify and publish combined release
        shell: bash
        run: |
          set -euo pipefail
          api_version="2026-03-10"
          published=0
          draft_id=""
          create_attempted=0
          run_marker="occt-sdk-bundle-run:${GITHUB_RUN_ID}:${GITHUB_RUN_ATTEMPT}"

          find_draft_id() {
            gh api --paginate \
              -H "X-GitHub-Api-Version: $api_version" \
              "repos/$GITHUB_REPOSITORY/releases?per_page=100" |
              jq -rs --arg tag "$GITHUB_REF_NAME" '
                [ .[][] | select(.tag_name == $tag and .draft == true) ] |
                if length == 1 then .[0].id
                elif length == 0 then empty
                else error("multiple draft releases found for tag")
                end
              '
          }

          find_our_draft_id() {
            gh api --paginate \
              -H "X-GitHub-Api-Version: $api_version" \
              "repos/$GITHUB_REPOSITORY/releases?per_page=100" |
              jq -rs --arg tag "$GITHUB_REF_NAME" --arg marker "$run_marker" '
                [ .[][] |
                  select(.tag_name == $tag and .draft == true) |
                  select((.body // "") | contains($marker))
                ] |
                if length == 1 then .[0].id
                elif length == 0 then empty
                else error("multiple workflow-owned draft releases found for tag")
                end
              '
          }

          cleanup_draft() {
            status=$?
            trap - EXIT
            if [[ "$status" -ne 0 && "$published" -eq 0 && "$create_attempted" -eq 1 ]]; then
              if [[ -z "$draft_id" ]]; then
                draft_id="$(find_our_draft_id 2>/dev/null || true)"
              fi
              if [[ -n "$draft_id" ]]; then
                gh api -X DELETE \
                  -H "X-GitHub-Api-Version: $api_version" \
                  "repos/$GITHUB_REPOSITORY/releases/$draft_id" || true
              fi
            fi
            exit "$status"
          }
          trap cleanup_draft EXIT

          existing_draft_id="$(find_draft_id)"
          if [[ -n "$existing_draft_id" ]] || gh api \
            -H "X-GitHub-Api-Version: $api_version" \
            "repos/$GITHUB_REPOSITORY/releases/tags/$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "release already exists for $GITHUB_REF_NAME" >&2
            exit 1
          fi

          bash .github/linux-occt-sdk/verify-tag.sh "$GITHUB_REF_NAME" "$WORKFLOW_SHA"
          bash .github/occt-sdk-release/verify-release-assets.sh "$RUNNER_TEMP/release-assets"

          mapfile -t assets < <(find "$RUNNER_TEMP/release-assets" -type f -print | sort)
          test "${#assets[@]}" -eq 14

          notes="OCCT $OCCT_VERSION SDK bundle built from official OCCT source $SOURCE_SHA."
          notes="$notes"$'\n\n'"Windows: official Open-Cascade-SAS V7_9_3 combined VC14 x64 Release package, copied byte-for-byte and verified against upstream SHA-256 $WINDOWS_SHA256."
          notes="$notes"$'\n'"Linux: qualified x86_64 shared/static SDKs with glibc 2.17 baseline."
          notes="$notes"$'\n'"macOS: qualified x86_64 and arm64 shared/static SDKs targeting macOS 13.0."
          notes="$notes"$'\n\n'"Workflow revision: $WORKFLOW_SHA"
          notes="$notes"$'\n\n'"<!-- $run_marker -->"

          create_attempted=1
          gh release create "$GITHUB_REF_NAME" "${assets[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --draft \
            --title "OCCT $OCCT_VERSION SDKs - Windows, Linux, macOS" \
            --notes "$notes"

          draft_id="$(find_our_draft_id)"
          test -n "$draft_id"
          release_json="$(gh api -H "X-GitHub-Api-Version: $api_version" \
            "repos/$GITHUB_REPOSITORY/releases/$draft_id")"
          test "$(jq -r '.draft' <<<"$release_json")" = "true"
          test "$(jq -r '.tag_name' <<<"$release_json")" = "$GITHUB_REF_NAME"
          test "$(jq '.assets | length' <<<"$release_json")" -eq 14
          for file in "${assets[@]}"; do
            name="$(basename "$file")"
            expected="sha256:$(sha256sum "$file" | awk '{print $1}')"
            actual="$(jq -r --arg name "$name" '.assets[] | select(.name == $name) | .digest' <<<"$release_json")"
            test "$actual" = "$expected"
          done

          bash .github/linux-occt-sdk/verify-tag.sh "$GITHUB_REF_NAME" "$WORKFLOW_SHA"
          gh api -X PATCH \
            -H "X-GitHub-Api-Version: $api_version" \
            "repos/$GITHUB_REPOSITORY/releases/$draft_id" \
            -F draft=false >/dev/null
          published=1

          release_json="$(gh api -H "X-GitHub-Api-Version: $api_version" \
            "repos/$GITHUB_REPOSITORY/releases/$draft_id")"
          test "$(jq -r '.draft' <<<"$release_json")" = "false"
          test "$(jq -r '.tag_name' <<<"$release_json")" = "$GITHUB_REF_NAME"
          test "$(jq '.assets | length' <<<"$release_json")" -eq 14
          for file in "${assets[@]}"; do
            name="$(basename "$file")"
            expected="sha256:$(sha256sum "$file" | awk '{print $1}')"
            actual="$(jq -r --arg name "$name" '.assets[] | select(.name == $name) | .digest' <<<"$release_json")"
            test "$actual" = "$expected"
          done
          bash .github/linux-occt-sdk/verify-tag.sh "$GITHUB_REF_NAME" "$WORKFLOW_SHA"
          trap - EXIT
