# Template only. Copy this file to .github/workflows/release-occt-sdk.yml,
# update all release-specific values, and commit that active workflow before
# preflight/tagging. Archive/remove the active copy after the release is immutable.
name: Release OCCT SDK bundle

on:
  workflow_dispatch:
  push:
    tags:
      - occt-sdk-8.0.1-r2

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  OCCT_VERSION: '8.0.1'
  OCCT_SOURCE_SHA: b8f597c677811d1f9f4d8a97f5ae2825c0353a42
  WINDOWS_ASSET: occt-combined-release-no-pch.zip
  WINDOWS_ASSET_SIZE: '257767212'
  WINDOWS_ASSET_SHA256: afe36b6abcc7964d0f8b0404ccb16e7c1f6ddd8e43b450c865f7e7f092440e9d
  WINDOWS_ASSET_URL: https://github.com/Open-Cascade-SAS/OCCT/releases/download/V8.0.1/occt-combined-release-no-pch.zip

jobs:
  linux:
    name: Linux SDKs
    uses: ./.github/workflows/build-linux-packages.yml

  macos:
    name: macOS SDKs
    uses: ./.github/workflows/build-macos-packages.yml

  windows:
    name: Windows SDKs
    uses: ./.github/workflows/build-windows-packages.yml

  publish:
    name: Publish combined OCCT SDK release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/occt-sdk-')
    needs:
      - linux
      - macos
      - windows
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      WORKFLOW_SHA: ${{ github.sha }}
      SOURCE_SHA: b8f597c677811d1f9f4d8a97f5ae2825c0353a42
      WINDOWS_SHA256: afe36b6abcc7964d0f8b0404ccb16e7c1f6ddd8e43b450c865f7e7f092440e9d
    steps:
      # actions/checkout v4.2.2
      - name: Checkout exact release workflow revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      # actions/download-artifact v4.3.0
      - name: Download Linux SDKs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: occt-linux-sdk-*
          path: ${{ runner.temp }}/release-assets/linux
          merge-multiple: true

      - name: Download macOS SDKs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: occt-macos-sdk-*
          path: ${{ runner.temp }}/release-assets/macos
          merge-multiple: true

      - name: Download Windows SDKs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: occt-windows-sdk-*
          path: ${{ runner.temp }}/release-assets/windows
          merge-multiple: true

      - name: Verify tag and exact combined asset inventory
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "occt-sdk-$OCCT_VERSION-r2"
          bash .github/linux-occt-sdk/verify-tag.sh "$GITHUB_REF_NAME" "$WORKFLOW_SHA"
          bash .github/occt-sdk-release/verify-release-assets.sh "$RUNNER_TEMP/release-assets"

      - name: Create, verify and publish combined release
        shell: bash
        run: |
          set -euo pipefail
          api_version="2026-03-10"
          published=0
          draft_id=""
          create_attempted=0
          run_marker="occt-sdk-bundle-run:${GITHUB_RUN_ID}:${GITHUB_RUN_ATTEMPT}"

          find_draft_id() {
            gh api --paginate \
              -H "X-GitHub-Api-Version: $api_version" \
              "repos/$GITHUB_REPOSITORY/releases?per_page=100" |
              jq -rs --arg tag "$GITHUB_REF_NAME" '
                [ .[][] | select(.tag_name == $tag and .draft == true) ] |
                if length == 1 then .[0].id
                elif length == 0 then empty
                else error("multiple draft releases found for tag")
                end
              '
          }

          find_our_draft_id() {
            gh api --paginate \
              -H "X-GitHub-Api-Version: $api_version" \
              "repos/$GITHUB_REPOSITORY/releases?per_page=100" |
              jq -rs --arg tag "$GITHUB_REF_NAME" --arg marker "$run_marker" '
                [ .[][] |
                  select(.tag_name == $tag and .draft == true) |
                  select((.body // "") | contains($marker))
                ] |
                if length == 1 then .[0].id
                elif length == 0 then empty
                else error("multiple workflow-owned draft releases found for tag")
                end
              '
          }

          cleanup_draft() {
            status=$?
            trap - EXIT
            if [[ "$status" -ne 0 && "$published" -eq 0 && "$create_attempted" -eq 1 ]]; then
              if [[ -z "$draft_id" ]]; then
                draft_id="$(find_our_draft_id 2>/dev/null || true)"
              fi
              if [[ -n "$draft_id" ]]; then
                gh api -X DELETE \
                  -H "X-GitHub-Api-Version: $api_version" \
                  "repos/$GITHUB_REPOSITORY/releases/$draft_id" || true
              fi
            fi
            exit "$status"
          }
          trap cleanup_draft EXIT

          existing_draft_id="$(find_draft_id)"
          if [[ -n "$existing_draft_id" ]] || gh api \
            -H "X-GitHub-Api-Version: $api_version" \
            "repos/$GITHUB_REPOSITORY/releases/tags/$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "release already exists for $GITHUB_REF_NAME" >&2
            exit 1
          fi

          bash .github/linux-occt-sdk/verify-tag.sh "$GITHUB_REF_NAME" "$WORKFLOW_SHA"
          bash .github/occt-sdk-release/verify-release-assets.sh "$RUNNER_TEMP/release-assets"

          mapfile -t assets < <(find "$RUNNER_TEMP/release-assets" -type f -print | sort)
          test "${#assets[@]}" -eq 16

          notes="OCCT $OCCT_VERSION SDK bundle built from official OCCT source $SOURCE_SHA."
          notes="$notes"$'\n\n'"Windows shared: official Open-Cascade-SAS V8.0.1 combined x64 Release/no-PCH package, copied byte-for-byte and verified against upstream SHA-256 $WINDOWS_SHA256."
          notes="$notes"$'\n'"Windows static: qualified lean x64 VC143 static SDK from the same official OCCT source commit, with optional third-party dependencies disabled."
          notes="$notes"$'\n'"Linux: qualified x86_64 shared/static SDKs with glibc 2.17 baseline."
          notes="$notes"$'\n'"macOS: qualified x86_64 and arm64 shared/static SDKs targeting macOS 13.0."
          notes="$notes"$'\n\n'"Workflow revision: $WORKFLOW_SHA"
          notes="$notes"$'\n\n'"<!-- $run_marker -->"

          create_attempted=1
          gh release create "$GITHUB_REF_NAME" "${assets[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --draft \
            --title "OCCT $OCCT_VERSION SDKs - Windows, Linux, macOS" \
            --notes "$notes"

          draft_id="$(find_our_draft_id)"
          test -n "$draft_id"
          release_json="$(gh api -H "X-GitHub-Api-Version: $api_version" \
            "repos/$GITHUB_REPOSITORY/releases/$draft_id")"
          test "$(jq -r '.draft' <<<"$release_json")" = "true"
          test "$(jq -r '.tag_name' <<<"$release_json")" = "$GITHUB_REF_NAME"
          test "$(jq '.assets | length' <<<"$release_json")" -eq 16
          for file in "${assets[@]}"; do
            name="$(basename "$file")"
            expected="sha256:$(sha256sum "$file" | awk '{print $1}')"
            actual="$(jq -r --arg name "$name" '.assets[] | select(.name == $name) | .digest' <<<"$release_json")"
            test "$actual" = "$expected"
          done

          bash .github/linux-occt-sdk/verify-tag.sh "$GITHUB_REF_NAME" "$WORKFLOW_SHA"
          gh api -X PATCH \
            -H "X-GitHub-Api-Version: $api_version" \
            "repos/$GITHUB_REPOSITORY/releases/$draft_id" \
            -F draft=false >/dev/null
          published=1

          release_json="$(gh api -H "X-GitHub-Api-Version: $api_version" \
            "repos/$GITHUB_REPOSITORY/releases/$draft_id")"
          test "$(jq -r '.draft' <<<"$release_json")" = "false"
          test "$(jq -r '.immutable' <<<"$release_json")" = "true"
          test "$(jq -r '.tag_name' <<<"$release_json")" = "$GITHUB_REF_NAME"
          test "$(jq '.assets | length' <<<"$release_json")" -eq 16
          for file in "${assets[@]}"; do
            name="$(basename "$file")"
            expected="sha256:$(sha256sum "$file" | awk '{print $1}')"
            actual="$(jq -r --arg name "$name" '.assets[] | select(.name == $name) | .digest' <<<"$release_json")"
            test "$actual" = "$expected"
          done
          bash .github/linux-occt-sdk/verify-tag.sh "$GITHUB_REF_NAME" "$WORKFLOW_SHA"
          trap - EXIT
